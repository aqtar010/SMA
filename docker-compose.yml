services:
  api:
    build:
      context: .
      dockerfile: Backend/SMA.API/Dockerfile
    ports:
      - "8080:8080"
      - "443:443"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+;http://+:8080
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${PFX_PASSWORD}
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=sma;Username=postgres;Password=${DB_PASSWORD}
      - Stripe__SecretKey=${STRIPE_SECRET_KEY}
      - Stripe__WebhookSecret=${STRIPE_WEBHOOK_SECRET}
      - Stripe__SuccessUrl=${STRIPE_SUCCESS_URL:-http://localhost:3000/orders/{0}}
      - Stripe__CancelUrl=${STRIPE_CANCEL_URL:-http://localhost:3000/checkout?cancelled=true&orderId={0}}
    user: "0"
    volumes:
      - ./Backend/SMA.API/certs/aspnetapp.pfx:/https/aspnetapp.pfx:ro
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: sma
    ports:
      - "7878:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sma"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: